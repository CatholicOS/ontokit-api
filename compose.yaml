# OntoKit Development Stack
# Run with: docker compose up -d
#
# This configuration runs ALL services in Docker containers (development mode).
# For production deployment, see compose.prod.yaml
#
# SETUP SCRIPTS:
#   Fresh start from clean slate (deletes all data):
#     ./scripts/reset-dev-environment.sh
#
#   Configure Zitadel OIDC after docker compose up:
#     ./scripts/setup-zitadel.sh --update-env
#
#   Full automated setup (starts Docker + configures + recreates containers):
#     ./scripts/setup-zitadel.sh --update-env --docker-init
#
#   Force regenerate client secrets (invalidates existing sessions):
#     ./scripts/setup-zitadel.sh --update-env --force-secrets
#
# After starting, access:
#   - OntoKit API: http://localhost:8000
#   - Zitadel Console: http://localhost:8080/ui/console
#   - Garage S3 API: http://localhost:9000  (no web console — use `docker exec ontokit-garage garage ...`)
#   - Mailpit (email testing): http://localhost:8025
#
# Default Zitadel admin: admin@ontokit.localhost / Admin123!

services:
  # ============================================================================
  # PostgreSQL Database (shared by Zitadel and OntoKit API)
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ontokit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      PGUSER: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d zitadel -U postgres && pg_isready -d ontokit -U ontokit"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ontokit

  # ============================================================================
  # Redis for caching and pub/sub
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: ontokit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ontokit

  # ============================================================================
  # Garage S3-compatible object storage (ontology files, exports, etc.).
  # Replaces MinIO (archived from Docker Hub). See scripts/garage.toml.
  # ============================================================================
  garage:
    image: dxflrs/garage:v2.5.0
    container_name: ontokit-garage
    restart: unless-stopped
    ports:
      - "9000:3900"  # S3 API (kept on 9000 for drop-in compatibility)
      - "3903:3903"  # admin API
    volumes:
      - garage_data:/var/lib/garage
      - ./scripts/garage.toml:/etc/garage.toml:ro
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ontokit

  # One-shot: assign layout, create bucket, import the dev access key.
  # Idempotent; safe to re-run on every `docker compose up`.
  #
  # The dxflrs/garage image is FROM scratch (no shell), so the init image
  # is built inline: alpine + the garage CLI copied from the server image.
  garage-init:
    build:
      context: ./scripts
      dockerfile_inline: |
        FROM dxflrs/garage:v2.5.0 AS garage-bin
        FROM alpine:3.21
        COPY --from=garage-bin /garage /usr/local/bin/garage
    image: ontokit/garage-init:v2.5.0
    container_name: ontokit-garage-init
    entrypoint: ["/bin/sh", "/scripts/init-garage.sh"]
    environment:
      # Garage requires access key IDs to be ≥8 characters; the old MinIO
      # defaults ("minio" / "minio123") don't fit, so the dev stack uses
      # 20-char credentials that are still obvious as dev-only placeholders.
      S3_ACCESS_KEY: ontokitdevaccesskey
      S3_SECRET_KEY: ontokitdevsecretkey
      S3_BUCKET: ontokit
    volumes:
      - ./scripts/garage.toml:/etc/garage.toml:ro
      - ./scripts/init-garage.sh:/scripts/init-garage.sh:ro
      # Shared read access to the garage metadata dir lets the CLI read
      # the server's node_key and connect via RPC (CLI auth model).
      - garage_data:/var/lib/garage:ro
    depends_on:
      garage:
        condition: service_healthy
    restart: "no"
    networks:
      - ontokit

  # ============================================================================
  # Mailpit (local email testing - catches all outgoing emails)
  # ============================================================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: ontokit-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"  # Web UI
    networks:
      - ontokit

  # ============================================================================
  # Zitadel Identity Provider
  # ============================================================================
  zitadel:
    image: ghcr.io/zitadel/zitadel:latest
    container_name: ontokit-zitadel
    restart: unless-stopped
    command: 'start-from-init --masterkey "MasterkeyNeedsToHave32Characters"'
    environment:
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 8080
      ZITADEL_EXTERNALSECURE: false
      ZITADEL_TLS_ENABLED: false

      # Database configuration (using shared postgres)
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable

      # Login V2 client machine user (creates PAT for login container)
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel-data/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: false
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Login V2 Client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: '2030-01-01T00:00:00Z'

      # Enable Login V2
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: true
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: http://localhost:8081/ui/v2/login
      ZITADEL_OIDC_DEFAULTLOGINURLV2: http://localhost:8081/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: http://localhost:8081/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: http://localhost:8081/ui/v2/login/login?samlRequest=

      # Admin machine user (creates PAT for API access)
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel-data/admin.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: api-admin
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: API Admin Machine User
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: '2030-01-01T00:00:00Z'

      # Human admin user
      ZITADEL_FIRSTINSTANCE_ORG_NAME: "OntoKit"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: Admin123!

      # SMTP configuration (using Mailpit for local development)
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_HOST: mailpit:1025
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_TLS: "false"
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROM: noreply@ontokit.localhost
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROMNAME: OntoKit

      # Debug logging
      ZITADEL_LOG_LEVEL: debug
      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: true

    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 60s
      retries: 5
      start_period: 10s
    user: "0"
    volumes:
      - zitadel_data:/zitadel-data
    ports:
      - "8080:8080"
      - "8081:3000"
    networks:
      - ontokit
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Login V2 - Next.js based login UI
  login:
    image: ghcr.io/zitadel/zitadel-login:latest
    container_name: ontokit-zitadel-login
    restart: unless-stopped
    environment:
      ZITADEL_API_URL: http://localhost:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel-data/login-client.pat
      EMAIL_VERIFICATION: true
    # Probe the username form page rather than the login landing. The
    # form is server-rendered using config the login app fetches from
    # Zitadel via gRPC, so a stuck gRPC channel produces an error
    # fallback that lacks the `username-text-input` test-id marker. The
    # plain landing page returns 200 even with a dead gRPC channel — see
    # issue #130 for the failure mode this guards against.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/ui/v2/login/loginname', { signal: AbortSignal.timeout(5000) }).then(async r => { if (!r.ok) process.exit(1); const body = await r.text(); process.exit(body.includes('data-testid=\"username-text-input\"') ? 0 : 1); }).catch(() => process.exit(1));"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    network_mode: service:zitadel
    user: "0"
    volumes:
      - zitadel_data:/zitadel-data:ro
    depends_on:
      zitadel:
        condition: service_healthy
        restart: false

  # ============================================================================
  # OntoKit API (FastAPI backend)
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ontokit/api:latest
    container_name: ontokit-api
    restart: unless-stopped
    environment:
      APP_ENV: development
      DEBUG: "true"
      SECRET_KEY: dev-secret-key-change-in-production
      HOST: 0.0.0.0
      PORT: 8000
      # Database - connects to shared postgres container
      DATABASE_URL: postgresql+asyncpg://ontokit:ontokit@postgres:5432/ontokit
      # Redis
      REDIS_URL: redis://redis:6379/0
      # Object storage (Garage, S3-compatible — var names kept as MINIO_*
      # to avoid a disruptive rename; they point at the Garage S3 endpoint).
      MINIO_ENDPOINT: garage:3900
      MINIO_ACCESS_KEY: ontokitdevaccesskey
      MINIO_SECRET_KEY: ontokitdevsecretkey
      MINIO_BUCKET: ontokit
      MINIO_SECURE: "false"
      # Zitadel
      ZITADEL_ISSUER: http://localhost:8080
      ZITADEL_INTERNAL_URL: http://zitadel:8080
      ZITADEL_CLIENT_ID: ${ZITADEL_CLIENT_ID:-}
      ZITADEL_CLIENT_SECRET: ${ZITADEL_CLIENT_SECRET:-}
      ZITADEL_SERVICE_TOKEN: ${ZITADEL_SERVICE_TOKEN:-}
      # CORS
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://localhost:53000"]'
      # Git Repository Storage
      GIT_REPOS_BASE_PATH: /data/repos
      # GitHub Integration
      GITHUB_TOKEN_ENCRYPTION_KEY: ${GITHUB_TOKEN_ENCRYPTION_KEY:-}
      # Superadmin - comma-separated list of Zitadel user IDs with full system access
      SUPERADMIN_USER_IDS: ${SUPERADMIN_USER_IDS:-}
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    command: ["uvicorn", "ontokit.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    # RUN_MIGRATIONS=1 (default) runs alembic on startup.
    # Set RUN_MIGRATIONS=0 on non-leader replicas in multi-replica deployments.
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for hot reload in development
      - ./ontokit:/home/ontokit/app/ontokit:ro
      # Mount alembic for migrations in development
      - ./alembic:/home/ontokit/app/alembic:ro
      # Mount entrypoint so migration changes are picked up without rebuild
      - ./scripts/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      # Git repositories for version control
      - git_repos:/data/repos
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    networks:
      - ontokit
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully

  # ============================================================================
  # ARQ Worker (background task processing)
  # ============================================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ontokit/api:latest
    container_name: ontokit-worker
    restart: unless-stopped
    command: ["arq", "ontokit.worker.WorkerSettings"]
    environment:
      APP_ENV: development
      DEBUG: "true"
      # Database - connects to shared postgres container
      DATABASE_URL: postgresql+asyncpg://ontokit:ontokit@postgres:5432/ontokit
      # Redis
      REDIS_URL: redis://redis:6379/0
      # Object storage (Garage, S3-compatible — see api service above)
      MINIO_ENDPOINT: garage:3900
      MINIO_ACCESS_KEY: ontokitdevaccesskey
      MINIO_SECRET_KEY: ontokitdevsecretkey
      MINIO_BUCKET: ontokit
      MINIO_SECURE: "false"
      # Git Repository Storage
      GIT_REPOS_BASE_PATH: /data/repos
      # GitHub Integration
      GITHUB_TOKEN_ENCRYPTION_KEY: ${GITHUB_TOKEN_ENCRYPTION_KEY:-}
    volumes:
      # Mount source code for hot reload in development
      - ./ontokit:/home/ontokit/app/ontokit:ro
      # Git repositories (shared with API)
      - git_repos:/data/repos
    # The worker shares the api image, which bakes in a `curl localhost:8000`
    # healthcheck. The worker has no HTTP server (it runs ARQ), so that check
    # always fails. Override with a check that PID 1 is still the arq process —
    # works without any extra binaries in the slim image.
    healthcheck:
      test: ["CMD-SHELL", "grep -q arq /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - ontokit
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully

networks:
  ontokit:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  garage_data:
  zitadel_data:
  git_repos:
